name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the demo
        run: npm run demo:build
      - name: Check the packed package in a clean app (React 19)
        run: node scripts/check-package.mjs
      - name: Check the packed package in a clean app (React 18)
        env:
          REACT_MAJOR: '18'
        run: node scripts/check-package.mjs
